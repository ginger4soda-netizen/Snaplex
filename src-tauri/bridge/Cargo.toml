[package]
name = "snaplex-bridge"
version = "0.1.0"
description = "Snaplex Chrome Native Messaging bridge"
authors = ["Snaplex"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[[bin]]
name = "snaplex-bridge"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
